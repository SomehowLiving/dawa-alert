# Daily refresh: re-fetch CDSCO's portal and write only new alerts to Arkiv (seeding is idempotent).
# Needs repository secrets ARKIV_PRIVATE_KEY (a funded Tiramisu testnet key) and ARKIV_API_KEY.
name: sync
on:
  schedule: [{ cron: "30 2 * * *" }]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HAS_KEYS: ${{ secrets.ARKIV_PRIVATE_KEY != '' && secrets.ARKIV_API_KEY != '' }}
    steps:
      - name: Skip when the repository secrets are not set
        if: env.HAS_KEYS != 'true'
        run: echo "::notice::ARKIV_PRIVATE_KEY and ARKIV_API_KEY are not set as repository secrets, so the daily sync is skipped."

      - if: env.HAS_KEYS == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_KEYS == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 24 }
      - if: env.HAS_KEYS == 'true'
        run: npm ci
      - if: env.HAS_KEYS == 'true'
        run: python3 -I scripts/fetch_portal.py   # aborts if the portal returns nothing or shrinks >20%
      - if: env.HAS_KEYS == 'true'
        run: node scripts/seed.ts
        env:
          PRIVATE_KEY: ${{ secrets.ARKIV_PRIVATE_KEY }}
          ARKIV_API_KEY: ${{ secrets.ARKIV_API_KEY }}
